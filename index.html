    <!-- Preload images, I found this online, I was having a delay with some images to appear -->
    <link rel="preload" as="image" href="./src/media/hero-page/bg3-s.webp" media="(800px <= width < 1280px)">

<body>
    <!-- The nav bar -->

        <!-- Nav bar browser -->
        <nav class="navbar__wrapper wrapper-padded desktop">
            <!-- Logo -->
            <div class="left">
                <a href="#hero-page"><span class="icon icon-logo icon-multicolor"></span></a>
            </div>

        </nav>

            <div>

            </div>

    <main>
        <section id="hero-page">
            <div class="hero-page">
                <div class="hero-page__wrapper gradient-border-sharp">
                    <div class="left">
                    <h1>Everything about coffee! We sell it to you!</h1>
                    <a href="#catalog">See catalog</a>
                </div>

                <div class="right">
                    <div class="img-container">
                        <picture >
                            <source srcset="./src/media/hero-page/coffee-s.webp" media="(max-width: 640px)" />
                            <source srcset="./src/media/hero-page/coffee-m.webp" media="(max-width: 1920px)" />
                            <source srcset="./src/media/hero-page/coffee-b.webp" />
                            <img class="hero-page__img" alt="Driping coffee into a cup" />
                        </picture>
                    </div>
                </div>
                </div>
            </div>
        </section>

        <!-- <section id="offers">

        <section class="bg-secondary" id="catalog">
            <h2>Catalog</h2>

            <div class="filters wrapper-padded">
                <div>
                    <p class="filter-lable">Filter by</p>
                    <div class="controls">
                        <form action="availability">
                            <select name="availability" id="availability">
                                <option value="availability">Availability</option>
                                <option value="in-stock">In stock</option>
                                <option value="out-of-stock">Out of stock</option>
                            </select> 
                        </form>

                        <form action="price">
                            <select name="price" id="price">
                                <option value="price">Price</option>
                                <option value="under">Under $15</option>
                                <option value="range">$15 - $20</option>
                                <option value="over">Over $20</option>
                            </select> 
                        </form>
                    </div>
                </div>
                <div>

                    <p class="filter-lable">Sort by</p>
                    <div class="controls">
                        <form action="sort">
                            <select name="sort-by" id="sort">
                                <option value="featured">Featured</option>
                                <option value="popular">Most popular</option>
                                <option value="alphavetically">Alphabetically</option>
                                <option value="high-price">Highest price</option>
                                <option value="low-price">Lowest price</option>
                            </select>
                        </form>
                    </div>
                </div>                
            </div>

                <article class="item">

                        <div class="item-img">

                                <source srcset="https://www.w3schools.com/tags/img_pink_flowers.jpg">
                                <img class="item-img" src="https://www.w3schools.com/tags/img_pink_flowers.jpg" alt="Classic Blend coffee bag" loading="lazy">
